name: Deploy GameHub to Aliyun ECS

# 与 deploy.yml（GitHub Pages → pan.devmini.space）并行，互不影响。
# 本工作流把构建产物推送到阿里云 ECS 的 nginx 站点 https://pan.devmini.space
#
# 为什么用 GitHub Actions 而不是在 ECS 上拉代码：
#   该 ECS 到 github.com:443 时通时断（实测 TCP 超时、git ls-remote 卡死），
#   改由 GitHub runner 主动连入 ECS:22，方向反过来，绕开问题链路。
#
# 前置 secrets：REMOTE_HOST / REMOTE_PORT / REMOTE_USER / REMOTE_PATH / REMOTE_PRIVATE_KEY

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]

concurrency:
  group: ecs-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-ecs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate data
        run: node scripts/validate.js

      # 保持公告文案与资源详情链接使用主域名 pan.devmini.space，不做域名替换。
      - name: Build
        run: npm run build

      # sitemap.xml / robots.txt 由 postbuild 的 gen-sitemap.js 生成，保持 pan.devmini.space。
      # 不在 ECS 工作流中替换域名，避免 ECS 与 Pages 使用不同的站点地址。
      - name: Verify generated sitemap/robots domain
        run: |
          grep -q 'Sitemap: https://pan.devmini.space/sitemap.xml' dist/robots.txt
          if grep -q 'mibear\.top' dist/sitemap.xml dist/robots.txt; then
            echo '::error::sitemap.xml/robots.txt 不应包含 mibear.top'
            exit 1
          fi
          echo "robots.txt -> $(grep '^Sitemap:' dist/robots.txt)"
          echo "sitemap.xml -> $(grep -c '<loc>https://pan.devmini.space' dist/sitemap.xml) 条 pan.devmini.space URL"

      - name: Deploy to Aliyun ECS via rsync
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: ${{ secrets.REMOTE_PATH }}
          remote_host: ${{ secrets.REMOTE_HOST }}
          remote_port: ${{ secrets.REMOTE_PORT }}
          remote_user: ${{ secrets.REMOTE_USER }}
          remote_key: ${{ secrets.REMOTE_PRIVATE_KEY }}

      - name: Health check
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://pan.devmini.space/)
          echo "https://pan.devmini.space/ -> $code"
          [ "$code" = "200" ] || exit 1
          # SEO 文件必须继续指向 pan.devmini.space。
          curl -sS --max-time 30 https://pan.devmini.space/robots.txt | grep -q 'Sitemap: https://pan.devmini.space/sitemap.xml' || {
            echo '::error::线上 robots.txt 的 Sitemap 未指向 pan.devmini.space'; exit 1; }
          left=$(curl -sS --max-time 30 https://pan.devmini.space/sitemap.xml | grep -c 'mibear\.top' || true)
          echo "线上 sitemap.xml 残留 mibear.top: $left"
          [ "$left" = "0" ] || exit 1
